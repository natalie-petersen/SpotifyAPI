<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>My Spotify Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src\blue.css">
    <script>
        function loadContent(page) {
            fetch(page)
                .then(response => response.text())
                .then(html => {
                    const newContent = document.getElementById('contentArea');
                    newContent.innerHTML = html;
                    console.log('Content loaded:', newContent.innerHTML);

                    const startupScripts = newContent.querySelectorAll('script[data-execute="start"]');
                    console.log('scripts are ' + startupScripts.length);

                    for (let script of startupScripts) {
                        const functionName = script.getAttribute('data-function'); // Extract function name from attribute listed in script tag (ie, loadUserInfo in home.html)
                        if (functionName) {
                            console.log('Executing script:', script.innerText);
                            import('./src/script.js').then(module => {
                                if (module[functionName]) {
                                    module[functionName](); // Call the function dynamically from the module
                                } else {
                                    console.error(`Function "${functionName}" not found in module.`);
                                }
                                //eval(script.innerText.replace('loadUserInfo()', 'module.loadUserInfo()'));
                            }).catch(error => console.error('error loading module: ', error))
                        }
                        else {
                            console.warn('No function specified for script:', script.innerText);
                        }
                    }

                })
                .catch(error => console.error('Error loading page:', error));

            // document.addEventListener('DOMContentLoaded', () => {
            //     loadContent('home.html');
            // })
        } 
    </script>
</head>

<body>
    <container>
        <header class="topbar">
            <div class="site-name">Spotify Stats</div>
        </header>
        <nav class=main-nav>
            <a onclick="loadContent('home.html')">Home</a>
            <a>-</a>
            <a onclick="loadContent('playlist.html')">View Recent Playlists</a>
            <a>-</a>
            <a onclick="loadContent('track.html')">View Top Tracks</a>
            <a>-</a>
            <a onclick="loadContent('artist.html')">View Top Artists</a>
        </nav>
        <div class="main">
            <div class="content">
                <div class="box" id="contentArea">
                </div>
            </div>
        </div>
    </container>
    <footer class="footer">
      Layout made by <a href="https://itinerae.org" target="_blank">Itinerae.</a>
    </footer>
    <script>
        loadContent('home.html');
    </script>
</body>

</html>
