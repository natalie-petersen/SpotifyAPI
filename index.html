<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>My Spotify Profile</title>

    <script>
        function loadContent(page) {
            fetch(page)
                .then(response => response.text())
                .then(html => {
                    const newContent = document.getElementById('contentArea');
                    newContent.innerHTML = html;
                    console.log('Content loaded:', newContent.innerHTML);
                
                const startupScripts = newContent.querySelectorAll('script[data-execute="start"]');
                console.log('scripts are '+ startupScripts.length);
                for(let script of startupScripts){
                    console.log('Executing script:', script.innterText);
                    import('./src/script.js').then(module=> {
                        eval(script.innerText.replace('loadUserInfo()', 'module.loadUserInfo()'));
                    }).catch(error => console.error('error loading module: ', error))
                }
            })
                .catch(error => console.error('Error loading page:', error));
        
        document.addEventListener('DOMContentLoaded', () => {
            loadContent('home.html');
        })
            } 
    </script>
</head>

<body>
    <h1>Spotify Stats</h1>
    <nav>
        <button onclick="loadContent('home.html')">Home</button>
        <button onclick="loadContent('playlist.html')">View Recent Playlists</button>
        <button onclick="loadContent('track.html')">View Top Tracks</button>
    </nav>
    <div id="contentArea" class="content">

     </div>
